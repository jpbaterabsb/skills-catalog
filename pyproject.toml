[project]
name = "skills-catalog"
version = "0.1.0"
description = "A shared, versioned catalog of Agent Skills exposed to AI assistants over MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
]

[project.scripts]
skills = "skills_catalog.cli:main"
skills-catalog-api = "skills_catalog.api.app:main"
skills-mcp = "skills_catalog.adapter.server:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Starlette nudges TestClient users towards httpx2; httpx is a pinned runtime dependency here.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
